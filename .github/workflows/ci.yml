# CI mínimo de operaciones: garantiza que main y las PRs compilan, tipan y
# pasan los tests antes de mergear. El build de Next corre sin env vars reales
# (el cliente de Supabase es lazy), así que no se necesitan secrets aquí.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
